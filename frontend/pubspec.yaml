name: kgpl_portal
description: "KGPL Intern Training & Management Portal - Cross Platform Web & Desktop Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  fl_chart: ^0.69.0
  file_picker: ^11.0.3
  web: ^1.1.1
  video_player: ^2.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  video_player_platform_interface: ^6.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/
